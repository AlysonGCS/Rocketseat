<form>
    <input type="number" name="nota" min="0" max="10" step="0.5">
    <button>Submit</button>
    
</form>

<form>
    <input 
    type="email"
    name="mail"
    pattern=".+@kabel\.com"
    required
    title="Email apenas @kabel.com"
    >
    <button>Enviar</button>
</form>

<form>
    <input 
    type="password"
    name="senha"
    minlength="5"
    maxlength="10"
    required
    title="Senha"
    pattern="[#0-9a-fA-F]{4,8}"
    title="Apenas hexadecimais"
    >
    <button>Enviar</button>
</form>

<form enctype="multipart/form-data">
    <input 
    type="file"
    name="arquivo"    
    >
    <br>
    <input 
    type="file"
    name="arquivos"
    multiple
    >
    <br>
    <input 
    type="file"
    name="arquivos-accept"
    accept=".html"    
    >
    <button>Enviar arquivos</button>
</form>

<form enctype="multipart/form-data">
    <input 
    type="range"
    name="total"
    min="0"
    max="10"
    step="0.5" 
    value="0"   
    >  
    <button>Enviar arquivos</button>
</form>

<form enctype="multipart/form-data">
    <datalist id="colorpeek">
        <option value="C456C2">
        <option value="DD56C1">            
        <option value="ACEDCC">
    </datalist>
    <input 
    type="color"
    name="cor"
    min="0"
    max="10"
    step="0.5" 
    value="#AA15cc"   
    list="colorpeek"
    >
    <button>Enviar arquivos</button>
</form>

<form enctype="multipart/form-data">
    <datalist id="colorpeek">
        <option value="C456C2">
        <option value="DD56C1">            
        <option value="ACEDCC">
    </datalist>
    <input type="checkbox" name="carro" value="fiat" checked>  
    <input type="checkbox" name="carro" value="Audi">  
    <input type="checkbox" name="carro" value="Chevrolet">  

    <input type="radio" name="carro" value="fiat" checked>  
    <input type="radio" name="carro" value="Audi">  
    <input type="radio" name="carro" value="Chevrolet">  
    <button>Enviar arquivos</button>
</form>

<form>
    <label>
        Nome
        <input type="text" name="nome" placeholder="Coloque seu nome"> 
    </label>

    <br>
    
    <label for="lastname">
        Nome
    </label>
    <input id="lastname" type="text" name="lastname" placeholder="Coloque seu sobrenome"> 
    
    <button>Enviar arquivos</button>
</form>

<form>
    <textarea
    name="texto"
    minlength="10"
    placeholder="Coloque seu texto aqui"
    
    >
    </textarea>
    <button>Enviar arquivos</button>
</form>

<form>
    <select name="car">
        <option value="">Selecione</option>
        <option label="fiat" value="fiat"></option>
        <option label="audi" value="audi"></option>
        <option label="BMW" value="BMW"></option>
    </select>
    <button>Enviar arquivos</button>
</form>

<form>
    <fieldset>        
        <legend>Contato</legend>

        <input type="text" name="nome">
        <input type="email" name="mail">
        <button>Enviar arquivos</button>
    </fieldset>
</form>
