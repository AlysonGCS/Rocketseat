<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Asap:ital,wght@0,100..900;1,100..900&family=Inconsolata:wght@200..900&family=Leckerli+One&family=Maven+Pro:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Asap:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Inconsolata:wght@200..900&family=Leckerli+One&family=Maven+Pro:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Asap:ital,wght@0,100..900;1,100..900&family=Baloo+2:wght@400..800&family=Inconsolata:wght@200..900&family=Leckerli+One&family=Maven+Pro:wght@400..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/index.css">
    <title>Formulário desafio</title>
</head>
<body>
    <div id="app">
        <aside id="secondary">
            <div class="content-aside">
                <img src="assets/Logo.svg" alt="logoFesta">
                <h1>Festivite</h1>
                <p>Crie um convite digital para o seu evento</p>                
            </div> 
        </aside>

        <main id="principal">
            <h1>Crie seu convite</h1>

            <form method="post">
                <fieldset class="about">
                    <legend><img src="assets/icons/calendar.svg" alt="Calendario">Sobre o evento</legend>
                    
                    <div class="input-wrapper">
                        <label for="title-event">Título</label>
                        <input type="text" id="title-event" name="title-event" placeholder="Nome do evento">
                    </div>
                    
                    <div class="input-wrapper">
                        <div class="flex gap16">
                            <div class="data-wrapper flex2">
                                <label for="dt-ini-event">Início</label>
                                <input type="datetime-local" step="60" id="dt-ini-event" name="dt-ini-event" lang="PT-BR">
                            </div>

                            <div class="data-wrapper flex2">
                                <label for="dt-fim-event">Fim</label>
                                <input type="datetime-local" step="60" id="dt-fim-event" name="dt-fim-event" lang="PT-BR">
                            </div>
                        </div>    
                    </div>

                    <div class="flex gap16">
                        <div class="input-wrapper flex1">
                            <label>Tipo</label>
                            <div class="radio-group flex">
                                <label class="type-wrapper" for="presencial">
                                    <input type="radio" name="type-conference" id="presencial" value="presencial" checked>
                                    <img class="icon-default" src="assets/icons/predio-default.svg" alt="">
                                    <img class="icon-checked" src="assets/icons/predio-checked.svg" alt="">
                                    <strong>Presencial</strong>
                                </label>
                            
                                <label class="type-wrapper" for="online">
                                    <input type="radio" name="type-conference" id="online" value="online">
                                    <img class="icon-default" src="assets/icons/video-default.svg" alt="">
                                    <img class="icon-checked" src="assets/icons/video-checked.svg" alt="">
                                    <strong>Online</strong>
                                </label>
                            </div>
                        </div>
                        <div class="input-wrapper flex1">
                            <div class="text-wrapper">
                                <label for="local">Local</label>
                                <input type="text" id="local" name="local" placeholder="Link ou endereço">
                            </div>
                        </div>    
                    </div>

                    <div class="textarea-wrapper">
                        <label for="description">Descrição</label>
                        <textarea name="description" id="description" cols="50" rows="5" placeholder="Escreva sobre os detalhes do evento"></textarea>
                    </div>
                </fieldset>

                <fieldset class="customization">
                    <legend><img src="assets/icons/pincel.svg" alt="ícone de pincel">Personalização</legend>
                    <div class="input-wrapper flex">
                        <label>Cor principal</label>
                        <div class="color-picker">
                            <label class="color-option">
                                <input type="checkbox" name="color" value="brand-light">
                                <span id="brand-light" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="navy">
                                <span id="navy" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="purple">
                                <span id="purple" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="fuschia">
                                <span id="fuschia" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="pink">
                                <span id="pink" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="danger">
                                <span id="danger" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="orange">
                                <span id="orange" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="yellow">
                                <span id="yellow" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="lime">
                                <span id="lime" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="green">
                                <span id="green" class="color-circle"></span>
                            </label>
                            <label class="color-option">
                                <input type="checkbox" name="color" value="cyan">
                                <span id="cyan" class="color-circle"></span>
                            </label>
                        </div>
                    </div>
                    <div class="input-wrapper">
                        <label>Tema do evento</label>

                        <div class="cards grid">
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="aniversario">
                                    <img src="assets/Aniversario.png" alt="foto de aniversário">
                                    <p>Aniversário</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="infantil">
                                    <img src="assets/infantil.png" alt="foto tema infantil">
                                    <p>Infantil</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="formatura">
                                    <img src="assets/formatura.png" alt="foto de formatura">
                                    <p>Formatura</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="casamento">
                                    <img src="assets/casamento.png" alt="foto de casamento">
                                    <p>Casamento</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="cha-de-bebe">
                                    <img src="assets/chaDeBebe.png" alt="foto de cha de bebe">
                                    <p>Chá de bebê</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="cha-de-panela">
                                    <img src="assets/chaDePanela.png" alt="foto de cha de panela">
                                    <p>Chá de panela</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="carnaval">
                                    <img src="assets/carnaval.png" alt="foto de carnaval">
                                    <p>Carnaval</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="pascoa">
                                    <img src="assets/Pascoa.png" alt="foto de pascoa">
                                    <p>Páscoa</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="sao-joao">
                                    <img src="assets/saoJoao.png" alt="foto de sao joao">
                                    <p>São João</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="halloween">
                                    <img src="assets/halloween.png" alt="foto de halloween">
                                    <p>Halloween</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="natal">
                                    <img src="assets/natal.png" alt="foto de presentes">
                                    <p>Natal</p>
                                </label>
                            </div>
                            <div class="card">
                                <label class="card-option">
                                    <input type="checkbox" name="tema" value="Outros">
                                    <img src="assets/outros.png" alt="foto da opção outros">
                                    <p>Outros</p>
                                </label>
                            </div>
                        </div>
                    </div>
                    
                </fieldset>
            </form>            
        </main>
    </div>    
</body>
</html>
